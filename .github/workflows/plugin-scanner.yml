name: Plugin Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Plugin Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action verifies the pinned scanner wheel's SHA-256 and PyPI provenance before install.
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@d777b580805f6fadb19a03f84daf0974c53c6d38 # v1.2.786
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
